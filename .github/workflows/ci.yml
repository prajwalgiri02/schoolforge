name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    name: Studio (Laravel + React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci
      - run: vendor/bin/pint --test
      - run: npm run typecheck
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  studio-docker:
    name: Studio Docker stack
    runs-on: ubuntu-latest
    needs: studio
    steps:
      - uses: actions/checkout@v4
      - name: Compose stack serves Studio over HTTPS and can generate sites
        run: |
          printf 'APP_KEY=base64:%s\nSTUDIO_HOST=localhost\n' "$(openssl rand -base64 32)" > .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -skf https://localhost/login > login.html && break; sleep 3; done
          grep -q 'data-page' login.html
          docker compose exec -T web php artisan studio:user ci@example.com --password=ci-password-123 --role=owner
          test "$(curl -sk -o /dev/null -w '%{http_code}' 'https://localhost/hosting/certificate-check?domain=evil.example.org')" = 404
          docker compose exec -T web test -f bootstrap/ssr/ssr.js
          docker compose exec -T web test -f generator/registry/themes/classic/theme.json
          docker compose exec -T web node generator/bin/schoolforge.js create /tmp/ci-site --config generator/examples/school.config.json --skip-install
          docker compose exec -T web composer --version
          docker compose exec -T web php artisan schedule:list | grep -q studio:backup
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --tail=200 || true

  generator:
    name: Generator CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
        working-directory: generator

  generated-nextjs:
    name: Generated site (Next.js)
    runs-on: ubuntu-latest
    needs: generator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and build every theme
        run: |
          for theme in classic modern playful elegant; do
            node generator/bin/schoolforge.js create "$RUNNER_TEMP/next-$theme" --config generator/examples/school.config.json --theme "$theme" --skip-install
          done
          cd "$RUNNER_TEMP/next-classic" && npm install --no-audit --no-fund && npx tsc --noEmit && npm run build
          for theme in modern playful elegant; do
            cp -r "$RUNNER_TEMP/next-classic/node_modules" "$RUNNER_TEMP/next-$theme/"
            (cd "$RUNNER_TEMP/next-$theme" && npm run build)
          done

  generated-laravel:
    name: Generated site (Laravel + Inertia)
    runs-on: ubuntu-latest
    needs: generator
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate with dependencies and production build
        run: node generator/bin/schoolforge.js create "$RUNNER_TEMP/laravel-site" --config generator/examples/school.config.json --target laravel-inertia-react --theme modern --build
      - name: Run the generated site's tests
        working-directory: ${{ runner.temp }}/laravel-site
        run: php artisan test
      - name: Server-side rendering smoke test
        working-directory: ${{ runner.temp }}/laravel-site
        run: |
          php artisan inertia:start-ssr &
          php artisan serve --port=8000 &
          sleep 5
          curl -sf http://127.0.0.1:8000/ > home.html
          grep -q '<h1' home.html
          grep -q 'Riverside Heights School' home.html
          grep -q 'application/ld+json' home.html
          curl -sf http://127.0.0.1:8000/sitemap.xml | grep -q '<urlset'

  docker:
    name: Docker images of generated sites
    runs-on: ubuntu-latest
    needs: [generated-nextjs, generated-laravel]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Next.js image serves the site
        run: |
          node generator/bin/schoolforge.js create "$RUNNER_TEMP/next-docker" --config generator/examples/school.config.json --skip-install
          cd "$RUNNER_TEMP/next-docker"
          docker build -t school-next .
          docker run -d -p 3000:3000 --name school-next school-next
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/ > home.html && break; sleep 2; done
          grep -q 'Riverside Heights School' home.html
          curl -sf http://127.0.0.1:3000/sitemap.xml | grep -q '<urlset'
      - name: Laravel compose stack serves server-rendered pages
        run: |
          node generator/bin/schoolforge.js create "$RUNNER_TEMP/laravel-docker" --config generator/examples/school.config.json --target laravel-inertia-react
          cd "$RUNNER_TEMP/laravel-docker"
          echo "APP_KEY=$(php artisan key:generate --show)" > .env.docker
          echo "APP_URL=http://127.0.0.1:8080" >> .env.docker
          docker compose --env-file .env.docker up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/about > about.html && break; sleep 3; done
          docker compose --env-file .env.docker ps
          grep -q '<h1' about.html
          grep -q 'About Us' about.html
          docker compose --env-file .env.docker exec -T web php artisan school:admin ci@example.com --password=ci-password-123
          curl -sf http://127.0.0.1:8080/admin/login > /dev/null
      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs school-next || true
          cd "$RUNNER_TEMP/laravel-docker" && docker compose --env-file .env.docker logs --tail=200 || true
